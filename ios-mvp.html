<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>氛圍閱讀 iOS MVP</title>
  <style>
    body { font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; padding: 24px; background: #11151d; color: #e6e6e6; }
    .card { max-width: 760px; margin: 0 auto; background: #1b212d; border: 1px solid #313a4a; border-radius: 12px; padding: 20px; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p, li { color: #c6d2e1; }
    .ok { color: #84e1ac; }
    .no { color: #ff8f8f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 氛圍閱讀 iOS Safari MVP</h1>
    <p>目前 iPhone 版先提供網頁翻譯核心功能，進階功能會分階段補上。</p>
    <ul>
      <li class="ok">✅ 支援：整頁翻譯、選取翻譯、基本設定同步</li>
      <li class="no">⏸️ 尚未提供：PDF 雙欄檢視器、AI 摘要、反白問答</li>
    </ul>
    <p>若你剛剛是從 PDF 入口進來，請先改在一般網頁使用翻譯功能；PDF 與 AI 功能將在後續版本提供。</p>
  </div>
</body>
</html>
